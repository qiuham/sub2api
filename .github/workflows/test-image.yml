name: Test image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: feature/anthropic-openai-dispatch
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          outputs: type=docker,dest=/tmp/sub2api-test.tar
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:test-${{ github.sha }}
          build-args: |
            VERSION=test-${{ github.sha }}
            COMMIT=${{ github.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: sub2api-test-image
          path: /tmp/sub2api-test.tar
          retention-days: 3
